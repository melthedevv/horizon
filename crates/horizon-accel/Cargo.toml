[package]
name = "horizon-accel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Horizon Fabric accelerator: Rust modules loaded via JNI inside the Java game"
rust-version = "1.85"

[lib]
name = "horizon_accel"
crate-type = ["cdylib"]
path = "src/main/rust/lib.rs"

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-world = { path = "../horizon-world" }
horizon-protocol = { path = "../horizon-protocol" }
jni = { version = "0.21", default-features = false, features = ["invocation"] }
thiserror = "1.0"
parking_lot = "0.12"
once_cell = "1.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[features]
default = []
chunk_io = []
worldgen = []
lighting = []
collision = []
meshing = []
pathfinding = []

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# No dev-dependencies needed (uuid replaced with inline implementation)